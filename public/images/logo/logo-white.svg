<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 60" fill="none" width="100%" height="100%">
  <!-- Icon: Medical Cross with Golden Ascending Swoosh -->
  <g transform="translate(6, 6)">
    <!-- Rounded Medical Cross Base -->
    <path
      d="M 18 2 C 20.2 2 22 3.8 22 6 L 22 18 L 34 18 C 36.2 18 38 19.8 38 22 L 38 26 C 38 28.2 36.2 30 34 30 L 22 30 L 22 42 C 22 44.2 20.2 46 18 46 L 14 46 C 11.8 46 10 44.2 10 42 L 10 30 L -2 30 C -4.2 30 -6 28.2 -6 26 L -6 22 C -6 19.8 -4.2 18 -2 18 L 10 18 L 10 6 C 10 3.8 11.8 2 14 2 Z"
      fill="#ffffff"
      transform="translate(8, 0)"
    />
    <!-- Ascending Dynamic Golden Swoosh Arrow -->
    <path
      d="M 4 44 C 14 44 26 34 34 14"
      stroke="#e39b2d"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- Arrowhead -->
    <polygon
      points="34,8 39,18 29,15"
      fill="#e39b2d"
    />
  </g>

  <!-- Wordmark Text: Razor Sharp Vector Jost Typography -->
  <text
    x="68"
    y="36"
    font-family="'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#ffffff"
    letter-spacing="-0.02em"
  >
    your<tspan font-weight="700" fill="#ffffff">Medicare</tspan><tspan font-weight="700" fill="#e39b2d">Trip</tspan>
  </text>

  <!-- Subtitle: Crisp Tracking Text -->
  <text
    x="70"
    y="49"
    font-family="'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="7.5"
    font-weight="700"
    letter-spacing="0.26em"
    fill="#ffffff"
    opacity="0.8"
  >
    YOUR MEDICAL TRAVEL COMPANY
  </text>
</svg>
